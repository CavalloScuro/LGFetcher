<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window id="lgfetcher-selection-window"
        title="LGFetcher - Choose a Copy"
        width="1180" height="650"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        onload="LGFetcherSelection.init();">
  <html:style><![CDATA[
    :root { color-scheme: light dark; }
    #wrap { padding: 20px 22px 18px; font-family: system-ui, -apple-system, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    #subtitle { margin: 0 0 16px; color: #667085; font-size: 13px; }
    #options { border: 1px solid #b9bec7; border-radius: 7px; overflow: auto; max-height: 470px; }
    .row { display: grid; grid-template-columns: 34px 62px minmax(125px,1fr) minmax(220px,2fr) minmax(125px,1fr) 58px 62px 60px 78px; gap: 8px; align-items: center; padding: 9px; border-bottom: 1px solid #d9dde4; font-size: 12px; }
    .row:last-child { border-bottom: 0; }
    .row.header { position: sticky; top: 0; z-index: 2; font-weight: 700; background: Canvas; }
    .option:hover { background: color-mix(in srgb, Highlight 9%, transparent); }
    .option.selected { background: color-mix(in srgb, Highlight 15%, transparent); }
    .cell { overflow-wrap: anywhere; }
    .title { font-weight: 600; }
    .cover { width: 46px; height: 62px; object-fit: contain; border-radius: 2px; background: color-mix(in srgb, CanvasText 5%, Canvas); }
    .cover-placeholder { width: 46px; height: 62px; display: grid; place-items: center; border: 1px solid #c7cbd2; border-radius: 2px; color: #8a9099; font-size: 9px; text-align: center; }
    #buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    button { min-width: 92px; padding: 6px 14px; }
  ]]></html:style>
  <html:div id="wrap">
    <html:h1>Choose a copy to download</html:h1>
    <html:p id="subtitle">Select one of the highest-ranked records, then click Download.</html:p>
    <html:div id="options"></html:div>
    <html:div id="buttons">
      <html:button id="cancel" type="button">Cancel</html:button>
      <html:button id="download" type="button" disabled="disabled">Download</html:button>
    </html:div>
  </html:div>
  <html:script src="selection.js"></html:script>
</window>
